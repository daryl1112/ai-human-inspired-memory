services:
  ollama:
    image: ollama/ollama:rocm          # ROCm build for the Radeon 8060S (gfx1151)
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "991"
      - "44"
    environment:
      - HSA_OVERRIDE_GFX_VERSION=11.5.1
      - HSA_ENABLE_SDMA=0
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_KEEP_ALIVE=60m
      - OLLAMA_HOST=0.0.0.0

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant:/qdrant/storage

  memory-service:
    build: .
    container_name: memory-service
    restart: unless-stopped
    depends_on:
      - ollama
      - qdrant
    ports:
      - "8100:8100"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - QDRANT_URL=http://qdrant:6333
      - WORKER_MODEL=${WORKER_MODEL:-qwen3:30b-a3b}
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
      - IDLE_CONSOLIDATE_S=${IDLE_CONSOLIDATE_S:-1800}
      - NIGHTLY_HOUR=${NIGHTLY_HOUR:-3}
    volumes:
      - ./data:/app/data

volumes:
  ollama:
  qdrant:
